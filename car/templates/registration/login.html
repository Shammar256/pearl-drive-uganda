{% extends 'index1.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5" style="max-width: 420px;">
  <h3>Sign in — Pearl Drive Uganda</h3>
  <form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
  </form>
  <p class="mt-3 text-muted">
    No account? <a href="{% url 'sign_in_page' %}">Register here</a>
  </p>
</div>
{% endblock %}
