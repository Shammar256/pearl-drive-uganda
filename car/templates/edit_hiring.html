{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block page_title %}Edit Hire{% endblock %}
{% block content %}

<div class="card mb-3">
  <div class="card-header bg-white">
    <h6 class="mb-0"><i class="bi bi-pencil"></i> Edit Hire #{{ hiring.id }}</h6>
  </div>
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="row g-3">
        {{ form|crispy }}
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
        <a href="{% url 'add_hiring_page' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
