{% extends 'base.html' %}
{% block page_title %}Live Fleet Tracker{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <h6 class="mb-0 fw-bold"><i class="bi bi-geo-alt-fill text-danger"></i> Live Fleet Tracking (Kampala)</h6>
    <span class="badge bg-success">Live Updates</span>
  </div>
  <div class="card-body p-0">
    <!-- The Map Container -->
    <div id="map" style="height: 600px; width: 100%; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;"></div>
  </div>
</div>

<!-- Include Leaflet CSS and JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

{% endblock %}

{% block extra_js %}
<script>
  // 1. Initialize the map
  const map = L.map('map').setView([0.3136, 32.5811], 11); 

  // 2. Add OpenStreetMap tiles
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
    referrerPolicy: 'strict-origin-when-cross-origin'
  }).addTo(map);

  // 3. Get the data from Django
  const cars = {{ cars_json|safe }};
  
  // Debugging: Open your browser console (F12) to see this!
  console.log("Cars data loaded:", cars); 

  // 4. Standard Red Pin Icon
  const redPin = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
  });

  // 5. Loop through the cars and add pins
  if (cars.length > 0) {
      cars.forEach(car => {
        const marker = L.marker([car.lat, car.lng], { icon: redPin }).addTo(map);
        
        marker.bindPopup(`
          <div style="font-family: sans-serif;">
            <h6 style="margin: 0; font-weight: bold; color: #1e3a8a;">${car.plate}</h6>
            <p style="margin: 2px 0; font-size: 12px;">${car.model}</p>
            <hr style="margin: 5px 0;">
            <p style="margin: 0; font-size: 11px;"><b>Customer:</b> ${car.customer}</p>
            <p style="margin: 0; font-size: 11px;"><b>Driver:</b> ${car.driver}</p>
            <p style="margin: 0; font-size: 10px; color: #888;">Updated: ${car.last_update}</p>
          </div>
        `);
      });
  } else {
      console.log("No GPS data found. Run the database command again.");
  }
</script>
{% endblock %}
