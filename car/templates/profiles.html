{% extends 'base.html' %}
{% block page_title %}My Profile{% endblock %}
{% block content %}
<div class="card p-4">
  <h5 class="mb-3"><i class="bi bi-person-circle"></i> {{ user.username }}</h5>
  <p class="text-muted mb-1"><strong>Email:</strong> {{ user.email|default:"—" }}</p>
  <p class="text-muted mb-1"><strong>Joined:</strong> {{ user.date_joined|date:"Y-m-d" }}</p>
  <p class="text-muted mb-3"><strong>Last login:</strong> {{ user.last_login|date:"Y-m-d H:i"|default:"—" }}</p>
  <a href="{% url 'password_change' %}" class="btn btn-outline-primary btn-sm">Change Password</a>
</div>
{% endblock %}
